[workspace]
resolver = "2"
members = [
    "crates/estudy-domain",
    "crates/estudy-storage",
    "crates/estudy-ui-kit",
    "crates/estudy-ui",
    "apps/estudy-preview",
    "apps/estudy-desktop",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.89"
license = "MIT"
authors = ["eStudy Contributors"]
description = "Sistema local-first de produtividade, projetos, estudos e leitura em Rust."

[workspace.dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
directories = "6.0.0"
hex = "0.4.3"
hmac = "0.13.0"
iced = { version = "0.14.0", features = ["svg", "canvas", "tokio"] }
rusqlite = { version = "0.43.0", features = ["bundled", "backup"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.1"
tempfile = "3"
thiserror = "2.0.21"
uuid = { version = "1.29.3", features = ["v7", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
