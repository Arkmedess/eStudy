[workspace]
resolver = "2"
members = [
    "crates/estudy-domain",
    "crates/estudy-storage",
    "crates/estudy-audio",
    "crates/estudy-ui-kit",
    "crates/estudy-ui",
    "apps/estudy-preview",
    "apps/estudy-desktop",
]

[workspace.package]
version = "0.6.2"
edition = "2024"
rust-version = "1.89"
license = "MIT"
authors = ["eStudy Contributors"]
description = "Sistema local-first de produtividade, projetos, estudos e leitura em Rust."

[workspace.dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
cpal = "0.18.2"
directories = "6.0.0"
hex = "0.4.3"
hmac = "0.13.0"
iced = { version = "0.14.0", default-features = false, features = ["tiny-skia", "x11", "wayland", "thread-pool", "svg", "canvas", "tokio", "linux-theme-detection", "web-colors"] }
rusqlite = { version = "0.43.0", features = ["bundled", "backup"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.1"
tempfile = "3"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter", "json"] }
uuid = { version = "1.29.3", features = ["v7", "serde"] }

[profile.dev]
debug = "line-tables-only"

# Otimiza dependências pesadas (como tiny-skia e cosmic-text) no modo dev para manter a UI fluida.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
